spring.application.name=travel-converter

# H2 in-memory database (resets on every restart - fine for a college project)
spring.datasource.url=jdbc:h2:mem:travelconverterdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Optional: enable H2 console for debugging at /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080
